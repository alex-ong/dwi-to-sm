[project]
name = "dwi-to-sm"
version = "0.1.0"
description = "Convert StepMania DWI simfiles to the SM format."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # shadowed builtins
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return style
    "PT",   # pytest style
    "RUF",
]
# PTH (prefer pathlib) is deliberately off: this codebase uses os.path throughout.
